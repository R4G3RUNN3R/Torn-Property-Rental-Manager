name: build-v03

on:
  push:
    branches:
      - feature/v0.3-ui-scan

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3-ui-scan
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Set release version
        run: |
          node -e "process.exit(require('./package.json').version === '0.3.0' ? 0 : 1)" || npm version 0.3.0 --no-git-tag-version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build userscript
        run: npm run build
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json R4G3RUNN3R-Property-Rental-Manager.user.js
          if git diff --cached --quiet; then
            echo "Release files already current"
          else
            git commit -m "build: generate Property Rental Manager v0.3.0"
            git push origin HEAD:feature/v0.3-ui-scan
          fi
