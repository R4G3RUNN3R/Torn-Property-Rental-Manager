name: test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-v032:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.3.2-staged-rental'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate v0.3.2 release
        run: |
          npm version 0.3.2 --no-git-tag-version --allow-same-version
          npm run build
      - name: Verify generated release
        run: |
          npm test
          npm run check
          npm run build:check
      - name: Commit release files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json R4G3RUNN3R-Property-Rental-Manager.user.js
          if git diff --cached --quiet; then
            echo "Release files already current."
          else
            git commit -m "build: generate v0.3.2 release"
            git push origin HEAD:${{ github.head_ref }}
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Verify generated userscript is current
        run: npm run build:check
