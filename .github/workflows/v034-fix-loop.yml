name: v034-fix-loop

on:
  push:
    branches:
      - feature/v0.3.4-manual-updates-cancel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.4-manual-updates-cancel
      - name: Remove redundant self-observer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/app-v034.js';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('    let observer = null;\n', '');
          const block = `    if (windowLike.MutationObserver && documentLike.body) {\n      observer = new windowLike.MutationObserver(() => {\n        enhanceMainPanel();\n        enhanceSettingsWindow();\n      });\n      observer.observe(documentLike.body, { childList: true, subtree: true });\n    }\n\n`;
          if (!source.includes(block)) throw new Error('Observer block not found');
          source = source.replace(block, '');
          source = source.replace(`        destroyed = true;\n        if (observer) observer.disconnect();\n        observer = null;\n        return baseController.destroy();`, `        destroyed = true;\n        return baseController.destroy();`);
          fs.writeFileSync(path, source, 'utf8');
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-v034.js
          git commit -m "fix: avoid redundant v0.3.4 DOM observer"
          git push origin HEAD:feature/v0.3.4-manual-updates-cancel

# Trigger after workflow creation.
